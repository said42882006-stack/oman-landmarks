name: Fetch then-and-now photos
on:
  push:
    paths: ["ba_sources.json", "tools/fetch_ba.py", ".github/workflows/fetch-ba.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-ba
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python -u tools/fetch_ba.py
        timeout-minutes: 25
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/ba
          git diff --cached --quiet || (git commit -m "Store then-and-now photos locally" && git push)
