<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>معالم سلطنة عُمان | خريطة المحافظات التفاعلية</title>
<link rel="preload" href="fonts/Cairo-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Cairo-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Cairo-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Cairo-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cairo";src:url("fonts/Cairo-Regular.woff2") format("woff2");font-weight:100 449;font-style:normal;font-display:swap}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-Medium.woff2") format("woff2");font-weight:450 549;font-style:normal;font-display:swap}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-SemiBold.woff2") format("woff2");font-weight:550 749;font-style:normal;font-display:swap}
@font-face{font-family:"Cairo";src:url("fonts/Cairo-ExtraBold.woff2") format("woff2");font-weight:750 1000;font-style:normal;font-display:swap}
</style>
<style>
:root{
  --font:"Cairo",-apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif;
  --bg:#f5f5f7; --label:#1d1d1f; --label2:#6e6e73; --label3:#86868b; --sep:rgba(0,0,0,.08);
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.6);
  --card:#fff; --accent:#0071e3; --shadow:0 12px 40px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --ease:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --label:#f5f5f7; --label2:#a1a1a6; --label3:#8e8e93; --sep:rgba(255,255,255,.1);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --glass:rgba(28,28,30,.72); --glass-strong:rgba(28,28,30,.88); --glass-border:rgba(255,255,255,.08);
  --card:#1c1c1e; --accent:#0a84ff; --shadow:0 12px 40px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--label);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"kern"}
button{font:inherit;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--glass-border);box-shadow:var(--shadow)}

/* ---------- map ---------- */
#stage{position:fixed;inset:0;background:#d3effb}
svg#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
.gov{cursor:pointer;outline:none}
.gov path{fill-opacity:.55;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill-opacity .35s var(--ease),stroke-width .35s var(--ease)}
.gov:hover path,.gov:focus-visible path{fill-opacity:.72;stroke-width:2.4}
.gov.sel path{fill-opacity:.78;stroke-width:3.5}
.gov.dim path{fill-opacity:.4}
.lbl{font-family:var(--font);font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-linejoin:round;transition:opacity .3s}
.lbl.hide{opacity:0}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:calc(12px + var(--safe-t));right:12px;left:12px;z-index:20;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 20px;border-radius:var(--r-lg)}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:20px;background:linear-gradient(160deg,#0a84ff,#0060df);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px;line-height:1.25}
.brand p{margin:0;font-size:12px;color:var(--label2);font-weight:500}
.search{pointer-events:auto;position:relative;width:min(360px,40vw);min-width:0;margin-inline-start:auto}
.search label{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;color:var(--label2);font-size:17px}
.search input{all:unset;flex:1;font-family:var(--font);font-size:15px;font-weight:500;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label3)}
.results{position:absolute;top:52px;inset-inline:0;border-radius:var(--r-lg);padding:6px;max-height:min(60vh,420px);overflow:auto;display:none}
.results.show{display:block;animation:pop .28s var(--ease)}
.results button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:12px}
.results button:hover,.results button.act{background:var(--fill)}
.results img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill)}
.results b{display:block;font-size:14px;font-weight:700}
.results small{display:block;font-size:12px;color:var(--label2)}
.results .none{padding:14px;text-align:center;color:var(--label2);font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}

/* map controls (Apple Maps style) */
.controls{position:fixed;left:16px;bottom:calc(24px + var(--safe-b));z-index:15;display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
.controls button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;font-size:19px;color:var(--label)}
.controls button+button{border-top:.5px solid var(--sep)}
.controls button:active{background:var(--fill)}
.lgbtn{font:inherit;position:fixed;left:16px;top:calc(76px + var(--safe-t));z-index:16;cursor:pointer;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--label)}
.legend{position:fixed;left:16px;top:calc(120px + var(--safe-t));z-index:16;border-radius:16px;padding:6px;width:190px;opacity:0;transform:scale(.96) translateY(-6px);transform-origin:top left;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.legend.show{opacity:1;transform:none;pointer-events:auto}
.legend h4{display:none}
.legend .grid2{display:flex;flex-direction:column;gap:0}
.legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.legend button:hover,.legend button.on{background:var(--fill)}
.legend i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.hint{position:fixed;bottom:calc(28px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:14;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;transition:opacity .3s,transform .4s var(--ease);white-space:nowrap}
.hint.hide{opacity:0;transform:translate(-50%,10px);pointer-events:none}

/* ---------- sheet ---------- */
.sheet{position:fixed;z-index:25;display:flex;flex-direction:column;overflow:hidden;background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:.5px solid var(--glass-border);box-shadow:var(--shadow)}
.grabber{display:none}
.sh-head{flex:none;padding:18px 20px 10px;display:flex;align-items:flex-start;gap:12px}
.sh-head .dot{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:22px;flex:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
.sh-head h2{margin:0;font-size:26px;font-weight:900;letter-spacing:-.3px;line-height:1.2}
.sh-head p{margin:2px 0 0;font-size:13px;color:var(--label2);font-weight:600}
.close{all:unset;cursor:pointer;margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--label2);font-size:15px;flex:none}
.close:active{background:var(--fill2)}
.seg-wrap{flex:none;padding:4px 20px 12px;overflow-x:auto;scrollbar-width:none}
.seg-wrap::-webkit-scrollbar{display:none}
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:0}
.seg button{all:unset;cursor:pointer;position:relative;z-index:1;display:flex;align-items:center;gap:5px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--label);white-space:nowrap;border-radius:8px;transition:color .2s}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:all .35s var(--ease)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:0 20px 28px;overscroll-behavior:contain;scroll-behavior:smooth}
.feature{all:unset;cursor:pointer;display:block;position:relative;width:100%;aspect-ratio:4/3.1;border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.16);transition:transform .3s var(--ease)}
.feature img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 30%,transparent 50%,rgba(0,0,0,.72))}
.feature .ov{position:absolute;z-index:1;inset:auto 18px 16px 18px;color:#fff}
.feature .eyebrow{font-size:12px;font-weight:800;opacity:.85;display:flex;gap:6px;align-items:center}
.feature h3{margin:2px 0 4px;font-size:24px;font-weight:900;line-height:1.2}
.feature p{margin:0;font-size:13px;line-height:1.6;opacity:.92;font-weight:500}
.feature .cnt,.tile .cnt{position:absolute;z-index:1;top:12px;left:12px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.07),0 0 0 .5px var(--sep);transition:transform .3s var(--ease)}
.feature:active,.tile:active{transform:scale(.97)}
.tile .ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--fill)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
@media (hover:hover){.tile:hover .ph img{transform:scale(1.05)}.tile:hover,.feature:hover{box-shadow:0 12px 28px rgba(0,0,0,.16)}}
.tile .cap{padding:10px 12px 12px}
.tile b{display:block;font-size:14px;font-weight:800;line-height:1.35}
.tile small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:3px}
.sec-title{margin:22px 2px 10px;font-size:19px;font-weight:900}
.credit{margin:18px 2px 0;font-size:11px;color:var(--label3);line-height:1.7}
.about{background:var(--card);border-radius:18px;padding:14px 16px 15px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07),0 0 0 .5px var(--sep)}
.about h4{margin:0 0 6px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--gc)}
.about p{margin:0;font-size:14px;line-height:1.85;font-weight:500}
.about.clamp p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.about .more{all:unset;cursor:pointer;margin-top:4px;font-size:13px;font-weight:800;color:var(--accent)}
.wlist{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07),0 0 0 .5px var(--sep)}
.wrow{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:default;position:relative}
.wrow+.wrow:before{content:"";position:absolute;top:0;right:52px;left:0;height:.5px;background:var(--sep)}
.wrow.has{cursor:pointer}.wrow.has:active{background:var(--fill)}
.wrow .wi{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--gc)}
.wrow .wi .i{width:16px;height:16px}
.wrow .wt{flex:1;min-width:0}
.wrow b{display:block;font-size:15px;font-weight:800}
.wrow small{display:block;font-size:12.5px;line-height:1.55;color:var(--label2);margin-top:1px}
.wrow .wn{flex:none;font-size:13px;font-weight:700;color:var(--label3);display:flex;align-items:center;gap:2px}
.wrow .wn .i{width:16px;height:16px}
.wbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:9px 10px 9px 14px;border-radius:14px;background:var(--fill);font-size:14px;font-weight:800}
.wbar button{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);font-weight:800}
.tile .w{display:block;font-size:11.5px;color:var(--label3);font-weight:700;margin-top:2px}

@media (min-width:821px){
  .sheet{top:calc(80px + var(--safe-t));bottom:16px;right:16px;width:420px;border-radius:var(--r-xl);transform:translateX(calc(100% + 32px));transition:transform .55s var(--ease)}
  .sheet.open{transform:none}
}
@media (max-width:820px){
  .brand{padding:8px 12px;gap:8px}.brand .logo{width:32px;height:32px;font-size:17px;border-radius:9px}.brand h1{font-size:15px;white-space:nowrap}.brand h1 .long{display:none}.brand p{display:none}
  .search{width:auto;flex:1 1 0}
  .topbar{flex-wrap:nowrap}
  .search label{height:48px}
  .lgbtn{top:auto;bottom:calc(24px + var(--safe-b));left:12px}.legend{top:auto;bottom:calc(68px + var(--safe-b));left:12px;transform-origin:bottom left;max-height:60vh;overflow:auto}
  .controls{left:12px;bottom:auto;top:calc(76px + var(--safe-t))}
  .sheet{left:0;right:0;bottom:0;height:calc(100% - 64px - var(--safe-t));border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .5s var(--ease);padding-bottom:var(--safe-b)}
  .sheet.dragging{transition:none}
  body.sheet-open .lgbtn,body.sheet-open .legend,body.sheet-open .hint{opacity:0;pointer-events:none}
  .grabber{display:block;flex:none;height:22px;cursor:grab;touch-action:none}
  .grabber:before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 0}
  .sh-head{padding-top:2px;touch-action:none}
  .sh-head h2{font-size:22px}
}

/* ---------- viewer (Photos style) ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:none;color:#fff;touch-action:none}
.viewer.open{display:block}
.viewer .bg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s var(--ease)}
.viewer.open.ready .bg{opacity:1}
.track{position:absolute;inset:0;display:flex;direction:ltr;will-change:transform}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:72px 0 150px}
.slide img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .35s var(--ease);will-change:transform;user-select:none;-webkit-user-drag:none}
.v-top,.v-bottom{position:absolute;left:0;right:0;z-index:3;transition:opacity .3s}
.viewer.chrome-off .v-top,.viewer.chrome-off .v-bottom{opacity:0;pointer-events:none}
.v-top{top:0;padding:calc(12px + var(--safe-t)) 14px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.v-top .t{flex:1;min-width:0}
.v-top b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-top small{font-size:12px;opacity:.75;font-weight:600}
.vbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);flex:none}
.vbtn:active{background:rgba(255,255,255,.28)}
.v-nav{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:44px;height:44px;font-size:22px}
.v-nav.prev{right:16px}.v-nav.next{left:16px}
.v-bottom{bottom:0;padding:16px 16px calc(16px + var(--safe-b));background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;flex-direction:column;align-items:center;gap:10px}
.wiki{background:var(--card);border-radius:18px;padding:14px 16px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07),0 0 0 .5px var(--sep);overflow:hidden}
.wiki .wh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--label2);margin-bottom:8px}
.wiki .wh .i{width:15px;height:15px}
.wiki .wimg{float:left;width:104px;height:104px;object-fit:cover;border-radius:12px;margin:2px 12px 6px 0;background:var(--fill)}
.wiki p{margin:0;font-size:14px;line-height:1.85;font-weight:500}
.wiki.clamp p{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.wiki .wf{clear:both;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.wiki .wf button{all:unset;cursor:pointer;font-size:13px;font-weight:800;color:var(--accent)}
.wiki .wf a{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.wiki .wf a .i{width:14px;height:14px}
.wiki .sk{height:12px;border-radius:6px;background:var(--fill);margin:8px 0;animation:skp 1.2s ease-in-out infinite}
.wiki .sk:nth-child(2){width:86%}.wiki .sk:nth-child(3){width:64%}
@keyframes skp{50%{opacity:.45}}
.wlist .wiki{margin:0 14px 12px 54px;box-shadow:none;background:var(--fill);padding:12px 14px}
.wrow .wn.exp .i{transition:transform .3s var(--ease)}.wrow.open .wn.exp .i{transform:rotate(180deg)}
.v-wiki{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin:6px auto 0;font-size:13px;font-weight:800;color:#fff;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.v-wiki .i{width:15px;height:15px}
.v-wpanel{max-width:680px;margin:8px auto 0;text-align:right;font-size:13.5px;line-height:1.8;max-height:28vh;overflow:auto;padding:10px 14px;border-radius:14px;background:rgba(20,20,22,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.v-wpanel a{color:#9fd0ff}
.v-desc{max-width:680px;margin:0;text-align:center;font-size:14px;line-height:1.7;font-weight:500;opacity:.92}
.strip{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:none;direction:ltr}
.strip::-webkit-scrollbar{display:none}
.strip button{all:unset;cursor:pointer;width:44px;height:56px;border-radius:6px;overflow:hidden;flex:none;opacity:.5;transition:all .3s var(--ease)}
.strip button.on{opacity:1;width:72px}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.v-credit{font-size:11px;opacity:.6;font-weight:500;text-align:center}
.v-credit a{color:#6cb6ff;text-decoration:none}
.fly{position:fixed;z-index:70;object-fit:cover;pointer-events:none;transition:all .45s var(--ease);border-radius:18px}
@media (max-width:820px){.v-nav{display:none!important}.slide{padding:64px 0 170px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg id="map" viewBox="0 0 810 1110" preserveAspectRatio="xMidYMid meet" role="group" aria-label="خريطة محافظات سلطنة عُمان">
    <image href="img/topo.jpg" x="0" y="0" width="810" height="1110"/>
    <g id="govs"></g>
    <g id="labels"></g>
  </svg>
</div>

<div class="topbar">
  <div class="brand glass"><div class="logo" id="logo"></div><div><h1>معالم <span class="long">سلطنة </span>عُمان</h1><p id="stat"></p></div></div>
  <div class="search">
    <label class="glass"><span id="sIcon"></span><input id="q" type="search" placeholder="ابحث عن قلعة، ميناء، فلج…" autocomplete="off" aria-label="بحث"></label>
    <div class="results glass" id="results" role="listbox"></div>
  </div>
</div>

    g.wil.forEach(w=>{const n=g.landmarks.filter(l=>l.w===w.n&&PHOTOS[l.k]).length,r=document.createElement("button");r.className="wrow"+(n||w.wt?" has":"");
      r.innerHTML='<span class="wi">'+ic("landmark")+'</span><span class="wt"><b>'+esc(w.n)+'</b><small>'+esc(w.d)+'</small></span>'+(n?'<span class="wn">'+n+ic("chev")+'</span>':w.wt?'<span class="wn exp">'+ic("chevd")+'</span>':'');
      if(n)r.onclick=()=>{filter="w:"+w.n;moveThumb();renderBody();$("shBody").scrollTop=0;};
      else if(w.wt)r.onclick=()=>{const nx=r.nextElementSibling;if(nx&&nx.classList.contains("wiki")){nx.remove();r.classList.remove("open");return;}r.classList.add("open");wikiCard(w.wt,L,r.nextElementSibling);};
      else r.tabIndex=-1;L.appendChild(r);});
    body.appendChild(L);}
  const c=document.createElement("p");c.className="credit";c.textContent="الصور من ويكيميديا كومنز بتراخيص حرة؛ اسم المصوّر والترخيص يظهران عند فتح كل صورة. النصوص المعنونة «من ويكيبيديا» تُجلب مباشرة من ويكيبيديا العربية (CC BY-SA).";body.appendChild(c);
}
/* ---------- live Wikipedia ---------- */
const WCACHE=new Map();
function wclean(t){return (t||"").split("\n").filter(x=>x.trim()&&!/^=+.*=+$/.test(x.trim())).join(" ").replace(/\s+/g," ").trim();}
async function wfetch(params){const r=await fetch("https://ar.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&"+params);if(!r.ok)throw 0;return r.json();}
function wiki(title){if(!title)return Promise.reject();if(WCACHE.has(title))return WCACHE.get(title);
  const pr=(async()=>{const q="prop=extracts|pageimages|info&inprop=url&explaintext=1&piprop=thumbnail|original&pithumbsize=640&titles="+encodeURIComponent(title);
    let j=await wfetch(q+"&exintro=1");let p=Object.values(j.query.pages)[0];if(!p||p.missing!==undefined)throw 0;let x=wclean(p.extract);
    if(x.length<60){const j2=await wfetch("prop=extracts&explaintext=1&exchars=900&titles="+encodeURIComponent(title));x=wclean(Object.values(j2.query.pages)[0].extract);}
    if(x.length<30&&!p.thumbnail)throw 0;
    return {t:p.title,x,th:p.thumbnail&&p.thumbnail.source,orig:p.original&&p.original.source,url:p.fullurl||("https://ar.wikipedia.org/wiki/"+encodeURIComponent(p.title))};})();
  WCACHE.set(title,pr);pr.catch(()=>WCACHE.delete(title));return pr;}
function wikiCard(title,parent,before){if(!title)return null;const c=document.createElement("div");c.className="wiki clamp";
  c.innerHTML='<div class="wh">'+ic("book")+'من ويكيبيديا</div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  before?parent.insertBefore(c,before):parent.appendChild(c);
  wiki(title).then(w=>{c.innerHTML='<div class="wh">'+ic("book")+'من ويكيبيديا • '+esc(w.t)+'</div>'+(w.th?'<img class="wimg" loading="lazy" src="'+w.th+'" alt="">':'')+'<p>'+esc(w.x||"")+'</p><div class="wf"><button>المزيد</button><a href="'+w.url+'" target="_blank" rel="noopener">اقرأ المقال كاملًا'+ic("ext")+'</a></div>';
    const b=c.querySelector(".wf button");b.onclick=()=>{c.classList.toggle("clamp");b.textContent=c.classList.contains("clamp")?"المزيد":"أقل";};
    requestAnimationFrame(()=>{const p=c.querySelector("p");if(p.scrollHeight<=p.clientHeight+2)b.style.visibility="hidden";});
  }).catch(()=>c.remove());return c;}
/* landmarks without local photos: borrow the article's lead image */
async function wikiPhotos(){for(const g of GOVS)for(const l of g.landmarks){if(PHOTOS[l.k]||!l.wt)continue;
  try{const w=await wiki(l.wt);if(w.orig||w.th){PHOTOS[l.k]=[{f:w.orig||w.th,t:w.th||w.orig,a:"صورة مقال ويكيبيديا",l:"انظر صفحة المقال",p:w.url}];if(cur>=0&&GOVS[cur]===g)renderSheet();}}catch(e){}}}
setTimeout(wikiPhotos,1500);
/* mobile detents */
function setDetent(f,anim){const sh=$("sheet");detent=f;const H=sh.offsetHeight;sh.classList.toggle("dragging",!anim);sh.style.transform="translateY("+(H*(1-f))+"px)";}
(()=>{let y0=null,t0=0,base=0;const start=e=>{if(!isMobile()||e.target.closest("button"))return;y0=e.clientY;base=new DOMMatrix(getComputedStyle($("sheet")).transform).m42;$("sheet").classList.add("dragging");e.currentTarget.setPointerCapture(e.pointerId);t0=performance.now();};
  const move=e=>{if(y0==null)return;const y=Math.max(0,base+e.clientY-y0);$("sheet").style.transform="translateY("+y+"px)";};
  const end=e=>{if(y0==null)return;const dy=e.clientY-y0,v=dy/(performance.now()-t0);y0=null;$("sheet").classList.remove("dragging");const H=$("sheet").offsetHeight;
    const pos=1-(base+dy)/H;let f=pos>.72?.97:pos>.28?.5:0;if(v<-.5)f=detent<.6?.97:.97;if(v>.5)f=detent>.6?.5:0;
    if(f===0){closeSheet();return;}setDetent(f,true);setTimeout(()=>cur>=0&&select(cur,true),520);};
  ["grabber","shHead"].forEach(id=>{const n=$(id);n.addEventListener("pointerdown",start);n.addEventListener("pointermove",move);n.addEventListener("pointerup",end);n.addEventListener("pointercancel",end);});
  $("grabber").addEventListener("click",()=>{setDetent(detent>.6?.5:.97,true);});})();

/* ---------- search (Spotlight style) ---------- */
const q=$("q"),res=$("results");let ri=0,rlist=[];
const norm=s=>s.replace(/[ًٌٍَُِّْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();
function search(){const v=norm(q.value.trim());if(!v){res.classList.remove("show");return;}
  rlist=[];GOVS.forEach((g,gi)=>{if(norm(g.ar).includes(v))rlist.push({gov:gi});});
  ALL.forEach(x=>{if(norm(x.l.ar+" "+x.l.d+" "+TYPES[x.l.type].n+" "+(x.l.w||"")).includes(v))rlist.push(x);});
  rlist=rlist.slice(0,12);ri=0;
  res.innerHTML=rlist.length?rlist.map((x,k)=>x.gov!==undefined?'<button data-k="'+k+'"><span class="dot" style="width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;background:'+GOVS[x.gov].color+'">'+ic("pin")+'</span><span><b>محافظة '+esc(GOVS[x.gov].ar)+'</b><small>'+GOVS[x.gov].landmarks.length+' معالم</small></span></button>'
    :'<button data-k="'+k+'"><img src="'+PHOTOS[x.l.k][0].t+'" alt=""><span><b>'+esc(x.l.ar)+'</b><small>'+TYPES[x.l.type].n+' • محافظة '+esc(GOVS[x.gi].ar)+'</small></span></button>').join(""):'<div class="none">لا توجد نتائج</div>';
  res.classList.add("show");hl();
  res.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(rlist[+b.dataset.k]));}
function hl(){res.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("act",k===ri));}
function pick(x){res.classList.remove("show");q.value="";q.blur();if(x.gov!==undefined){select(x.gov);return;}select(x.gi);setTimeout(()=>openViewer(x.l,x.gi,null),450);}
q.addEventListener("input",search);
q.addEventListener("keydown",e=>{if(!res.classList.contains("show"))return;if(e.key==="ArrowDown"){ri=Math.min(ri+1,rlist.length-1);hl();e.preventDefault();}if(e.key==="ArrowUp"){ri=Math.max(ri-1,0);hl();e.preventDefault();}if(e.key==="Enter"&&rlist[ri])pick(rlist[ri]);if(e.key==="Escape"){res.classList.remove("show");q.blur();}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.classList.remove("show");});
document.addEventListener("keydown",e=>{if((e.key==="k"&&(e.metaKey||e.ctrlKey))||(e.key==="/"&&document.activeElement!==q)){e.preventDefault();q.focus();}});

/* ---------- viewer (Photos style) ---------- */
const V=$("viewer"),track=$("track");let vl=null,vlist=[],vi=0,zoom=1;
function openViewer(l,gi,fromImg){
  vl=l;vlist=PHOTOS[l.k];vi=0;zoom=1;
  $("vTitle").textContent=l.ar;$("vSub").textContent="محافظة "+GOVS[gi].ar+" • "+TYPES[l.type].n;$("vDesc").textContent=l.d;
  const vb=$("vWiki"),vp=$("vWpanel");vp.hidden=true;vp.innerHTML="";vb.hidden=true;
  if(l.wt){vb.innerHTML=ic("book")+"اقرأ عنه في ويكيبيديا";wiki(l.wt).then(w=>{if(vl!==l)return;vb.hidden=false;
    vb.onclick=()=>{vp.hidden=!vp.hidden;if(!vp.innerHTML)vp.innerHTML=esc(w.x)+' <a href="'+w.url+'" target="_blank" rel="noopener">المقال كاملًا ↗</a>';};}).catch(()=>{});}
  track.innerHTML=vlist.map(p=>'<div class="slide"><img src="'+p.f+'" alt="'+esc(l.ar)+'" draggable="false"></div>').join("");
  $("strip").innerHTML=vlist.map((p,k)=>'<button aria-label="صورة '+(k+1)+'"><img src="'+p.t+'" alt=""></button>').join("");
  $("strip").querySelectorAll("button").forEach((b,k)=>b.onclick=()=>go(k));
  $("strip").style.display=vlist.length>1?"flex":"none";
  $("vPrev").style.display=$("vNext").style.display=vlist.length>1?"grid":"none";
  V.classList.add("open");V.classList.remove("chrome-off","ready");go(0,false);
  const target=track.children[0].querySelector("img");
  if(fromImg&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    const r=fromImg.getBoundingClientRect();const fl=new Image();fl.src=fromImg.src;fl.className="fly";
    Object.assign(fl.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});document.body.appendChild(fl);target.style.opacity=0;
    requestAnimationFrame(()=>{V.classList.add("ready");const W=innerWidth,H=innerHeight,ar=(fromImg.naturalWidth||4)/(fromImg.naturalHeight||3);
      const mh=H-(isMobile()?234:222),mw=W;let w=mw,h=w/ar;if(h>mh){h=mh;w=h*ar;}const top=(isMobile()?64:72)+(mh-h)/2;
      Object.assign(fl.style,{left:(W-w)/2+"px",top:top+"px",width:w+"px",height:h+"px",borderRadius:"4px"});});
    setTimeout(()=>{target.style.opacity=1;fl.remove();},470);
  } else requestAnimationFrame(()=>V.classList.add("ready"));
}
function go(n,animate=true){if(!vlist.length)return;vi=Math.max(0,Math.min(vlist.length-1,n));setZoom(1);
  track.style.transition=animate?"transform .45s var(--ease)":"none";track.style.transform="translateX("+(-vi*100)+"%)";
  $("strip").querySelectorAll("button").forEach((b,k)=>b.classList.toggle("on",k===vi));$("strip").children[vi]?.scrollIntoView({inline:"center",block:"nearest",behavior:animate?"smooth":"auto"});
  const p=vlist[vi];$("vCredit").innerHTML=(vlist.length>1?(vi+1)+" من "+vlist.length+" • ":"")+"تصوير: "+esc(p.a||"غير معروف")+" • "+esc(p.l)+' • <a href="'+p.p+'" target="_blank" rel="noopener">المصدر</a>';}
function setZoom(z,ox=0,oy=0){zoom=z;const img=track.children[vi]?.querySelector("img");if(img)img.style.transform=z===1?"":"translate("+ox+"px,"+oy+"px) scale("+z+")";}
function closeViewer(){V.classList.remove("ready");setTimeout(()=>{V.classList.remove("open");track.innerHTML="";},300);}
$("vClose").onclick=closeViewer;$("vPrev").onclick=()=>go(vi-1);$("vNext").onclick=()=>go(vi+1);
document.addEventListener("keydown",e=>{if(!V.classList.contains("open")){if(e.key==="Escape")closeSheet();return;}
  if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")go(vi+1);if(e.key==="ArrowRight")go(vi-1);});
/* gestures: swipe, swipe-down to dismiss, double-tap zoom, tap to toggle chrome */
(()=>{let s=null,lastTap=0;
  V.addEventListener("pointerdown",e=>{if(e.target.closest("button,a"))return;s={x:e.clientX,y:e.clientY,t:performance.now(),dx:0,dy:0};track.style.transition="none";});
  V.addEventListener("pointermove",e=>{if(!s||zoom>1)return;s.dx=e.clientX-s.x;s.dy=e.clientY-s.y;
    if(Math.abs(s.dy)>Math.abs(s.dx)&&s.dy>0){const img=track.children[vi].querySelector("img");img.style.transform="translateY("+s.dy+"px) scale("+(1-Math.min(.25,s.dy/1600))+")";V.querySelector(".bg").style.opacity=1-Math.min(.8,s.dy/400);}
    else track.style.transform="translateX(calc("+(-vi*100)+"% + "+s.dx+"px))";});
  V.addEventListener("pointerup",e=>{if(!s)return;const {dx,dy}=s;const dt=performance.now()-s.t;V.querySelector(".bg").style.opacity="";
    const img=track.children[vi]?.querySelector("img");
    if(zoom===1&&dy>110&&Math.abs(dy)>Math.abs(dx)){closeViewer();s=null;return;}
    if(img&&zoom===1)img.style.transform="";
    if(zoom===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){go(vi+(dx<0?1:-1));s=null;return;}
    go(vi,true);
    if(Math.abs(dx)<6&&Math.abs(dy)<6&&dt<300&&!e.target.closest(".v-bottom,.v-top")){const now=performance.now();
      if(now-lastTap<300){const r=img.getBoundingClientRect();zoom>1?setZoom(1):setZoom(2.4,(r.left+r.width/2-e.clientX)*1.4,(r.top+r.height/2-e.clientY)*1.4);lastTap=0;}
      else{lastTap=now;setTimeout(()=>{if(lastTap&&performance.now()-lastTap>=280){V.classList.toggle("chrome-off");lastTap=0;}},300);}}
    s=null;});
})();

/* init */
setVB(fitBox(FULL,.02));
</script>
